name: Сборка Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже предустановлен на ubuntu-latest — ставим только нужные пакеты.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Кэш Godot и шаблонов
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Скачать Godot и шаблоны экспорта
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          cd ~/godot-bin
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          rm *.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          cp tpl/templates/android_* tpl/templates/version.txt $T/
          rm -rf tpl *.tpz

      - name: Настройки редактора и debug-ключ
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $RUNNER_TEMP/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Импорт проекта
        run: ~/godot-bin/godot --headless --path . --import

      - name: Автотест (автоигрок проходит первый бой)
        run: timeout 120 ~/godot-bin/godot --headless --path . -- --autoplay

      - name: Экспорт APK
        run: |
          mkdir -p build
          ~/godot-bin/godot --headless --path . --export-debug "Android" build/lastwarden-debug.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: lastwarden-apk
          path: build/lastwarden-debug.apk

      # Свежая сборка с основной ветки — по прямой ссылке, удобно качать с телефона.
      - name: Опубликовать «последнюю сборку»
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Последняя сборка «Последний Страж»
          prerelease: true
          files: build/lastwarden-debug.apk
          body: Автоматическая debug-сборка с ветки main (${{ github.sha }}).
